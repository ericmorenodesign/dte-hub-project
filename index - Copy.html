<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAMS TO ETERNITY</title>
  <link rel="stylesheet" href="css/void.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: #020204;
  overflow: hidden;
  font-family: 'Cinzel', serif;
  cursor: crosshair;
  touch-action: none;
}

#webglCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Ephemeral Track & Lyric Whispers */
.void-whisper {
  position: fixed;
  top: 5.5vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  pointer-events: none;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 90%;
  max-width: 760px;
}

.whisper-title {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.65em;
  color: #c8c4d0;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 1.4s ease;
}

.whisper-title.active {
  opacity: 0.58;
}

.whisper-lyric {
  font-size: clamp(0.75rem, 1.15vw, 0.95rem);
  font-weight: 400;
  letter-spacing: 0.24em;
  color: rgba(235, 232, 245, 0.78);
  text-shadow: 0 0 20px var(--node-glow, rgba(255, 255, 255, 0.4));
  opacity: 0;
  filter: blur(4px);
  transition: opacity 1.4s ease, filter 1.4s ease;
  min-height: 1.4em;
}

.whisper-lyric.active {
  opacity: 0.78;
  filter: blur(0px);
}

/* Clean, Etched-Inside-Crystal Projection */
.crystal-projection {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 8vh 6vw;
  background: radial-gradient(circle at center, rgba(2, 2, 4, 0.55) 0%, rgba(2, 2, 4, 0.0) 75%);
  opacity: 0;
  filter: blur(10px);
  transform: scale(0.96);
  transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

.crystal-projection.manifest {
  opacity: 1;
  filter: blur(0px);
  transform: scale(1);
  pointer-events: auto;
}

.projection-inner {
  max-width: 640px;
  width: 100%;
  text-align: center;
  position: relative;
  padding: 20px;
}

.projection-tag {
  font-family: 'Cinzel', serif;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.55em;
  color: var(--node-rim, #78d8b0);
  text-shadow: 0 0 16px var(--node-glow, rgba(120, 216, 176, 0.5));
  margin-bottom: 14px;
  text-transform: uppercase;
}

.projection-heading {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.2rem, 2.1vw, 1.75rem);
  font-weight: 700;
  letter-spacing: 0.36em;
  color: #ffffff;
  text-shadow:
    calc(-1px - var(--chroma-shift, 0px)) 0 10px rgba(255, 60, 100, 0.32),
    calc(1px + var(--chroma-shift, 0px)) 0 10px rgba(0, 230, 255, 0.32),
    0 0 28px var(--node-glow, rgba(255, 255, 255, 0.45));
  margin-bottom: 24px;
}

.projection-body {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.05rem, 1.35vw, 1.25rem);
  line-height: 1.85;
  letter-spacing: 0.05em;
  color: rgba(238, 236, 245, 0.92);
  text-shadow:
    0 0 16px rgba(0, 0, 0, 0.98),
    0 0 28px var(--node-glow, rgba(255, 255, 255, 0.28));
  max-height: 54vh;
  overflow-y: auto;
  scrollbar-width: none;
  white-space: pre-line;
  touch-action: pan-y;
}

.projection-body::-webkit-scrollbar {
  display: none;
}

.projection-art-frame {
  width: min(340px, 68vw);
  height: min(340px, 68vw);
  margin: 0 auto 18px auto;
  position: relative;
  display: none;
  align-items: center;
  justify-content: center;
}

.projection-art-frame.visible {
  display: flex;
}

.projection-art-canvas {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 26px var(--node-glow, rgba(120, 216, 176, 0.4)));
}

.projection-dismiss {
  margin-top: 28px;
  font-family: 'Cinzel', serif;
  font-size: 0.60rem;
  letter-spacing: 0.48em;
  color: rgba(200, 196, 210, 0.45);
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.4s ease, text-shadow 0.4s ease;
}

.projection-dismiss:hover {
  color: #ffffff;
  text-shadow: 0 0 14px #ffffff;
}

/* Subtle 3D Shard Labels inside the Quantum Chamber */
.shard-labels-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.shard-label {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: 'Cinzel', serif;
  font-size: 0.60rem;
  font-weight: 700;
  letter-spacing: 0.42em;
  color: rgba(220, 218, 230, 0.42);
  text-shadow: 0 0 12px rgba(0, 0, 0, 0.95);
  white-space: nowrap;
  transition: color 0.4s ease, opacity 0.5s ease, text-shadow 0.4s ease, transform 0.4s ease;
  opacity: 0;
}

.shard-label.visible {
  opacity: 1;
}

.shard-label.hovered {
  color: #ffffff;
  transform: translate(-50%, -50%) scale(1.1);
  text-shadow: 0 0 16px var(--node-glow, #ffffff);
}

/* Bold Roman Numerals I - VII */
.roman-nav {
  position: fixed;
  bottom: 6.5vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: clamp(24px, 4.5vw, 64px);
  pointer-events: auto;
  transition: opacity 1.0s ease, transform 1.0s ease;
}

body.realm-breached .roman-nav {
  opacity: 0.35;
}

body.realm-breached .roman-nav:hover {
  opacity: 0.95;
}

.roman-node {
  background: none;
  border: none;
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: clamp(1.05rem, 1.5vw, 1.35rem);
  letter-spacing: 0.12em;
  color: rgba(160, 155, 175, 0.28);
  cursor: pointer;
  padding: 10px 8px;
  transition: color 0.7s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.7s ease;
  position: relative;
}

.roman-node:hover {
  color: rgba(235, 232, 245, 0.78);
  transform: translateY(-3px);
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
}

.roman-node.active {
  color: #ffffff;
  transform: translateY(-4px);
  text-shadow:
    0 0 16px var(--node-glow, rgba(255, 255, 255, 0.6)),
    0 0 36px var(--node-glow, rgba(255, 255, 255, 0.3));
}

.roman-node.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 10px #ffffff;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.roman-node.active.playing::after {
  box-shadow: 0 0 14px #ffffff, 0 0 24px var(--node-glow, #ffffff);
  transform: translateX(-50%) scale(1.35);
}

/* 1px Astral Seek Thread */
.astral-thread-wrap {
  position: fixed;
  bottom: 2.2vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(460px, 68vw);
  height: 14px;
  display: flex;
  align-items: center;
  z-index: 3;
  cursor: pointer;
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: auto;
}

.astral-thread-wrap.visible {
  opacity: 0.45;
}

.astral-thread-wrap:hover {
  opacity: 0.85;
}

.astral-thread-track {
  width: 100%;
  height: 1px;
  background: rgba(255, 255, 255, 0.12);
  position: relative;
}

.astral-thread-fill {
  height: 100%;
  width: 0%;
  background: #ffffff;
  box-shadow: 0 0 10px #ffffff, 0 0 20px var(--node-glow, #ffffff);
  position: relative;
}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="webglCanvas"></div>

  <div class="void-whisper">
    <span class="whisper-title" id="whisperTitle"></span>
    <span class="whisper-lyric" id="whisperLyric"></span>
  </div>

  <!-- Subtle 3D labels hovering below the 4 Memory Shards inside the Quantum Chamber -->
  <div class="shard-labels-layer" id="shardLabelsLayer">
    <div class="shard-label" id="shardLabel0"></div>
    <div class="shard-label" id="shardLabel1"></div>
    <div class="shard-label" id="shardLabel2"></div>
    <div class="shard-label" id="shardLabel3"></div>
  </div>

  <!-- Borderless Etched-Inside-Glass Projection when inspecting a Memory Shard -->
  <div class="crystal-projection" id="crystalProjection">
    <div class="projection-inner">
      <div class="projection-tag" id="projTag"></div>
      <div class="projection-heading" id="projHeading"></div>
      <div class="projection-art-frame" id="projArtFrame">
        <canvas class="projection-art-canvas" id="projArtCanvas" width="512" height="512"></canvas>
      </div>
      <div class="projection-body" id="projBody"></div>
      <div class="projection-dismiss" id="projDismiss">[ CLICK ANYWHERE OR PRESS ESC TO RETURN ]</div>
    </div>
  </div>

  <!-- Simple Bold Roman Numerals I - VII (Default active: I SIMULACRA) -->
  <nav class="roman-nav" id="romanNav">
    <button class="roman-node active" data-idx="0">I</button>
    <button class="roman-node" data-idx="1">II</button>
    <button class="roman-node" data-idx="2">III</button>
    <button class="roman-node" data-idx="3">IV</button>
    <button class="roman-node" data-idx="4">V</button>
    <button class="roman-node" data-idx="5">VI</button>
    <button class="roman-node" data-idx="6">VII</button>
  </nav>

  <!-- Razor-thin 1px Astral Thread for scrubbing/seeking -->
  <div class="astral-thread-wrap" id="threadWrap">
    <div class="astral-thread-track">
      <div class="astral-thread-fill" id="threadFill"></div>
    </div>
  </div>

  <script type="module" src="js/void-engine.js"></script>
</body>
</html>
